<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#222321" />
    <title>Sem conexão · MartinTech View</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #222321; color: #eeeae1; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); text-align: center; }
      img { width: 88px; height: 88px; padding: 12px; border-radius: 24px; background: #eeeae1; }
      h1 { margin: 26px 0 10px; font-size: clamp(1.6rem, 6vw, 2rem); }
      p { color: #c6c3bd; line-height: 1.6; }
      a { display: inline-flex; align-items: center; justify-content: center; margin-top: 18px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; color: #222321; background: #eeeae1; font-size: 1rem; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #c69a9a; outline-offset: 3px; }
      small { display: block; margin-top: 22px; color: #9b9993; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet para carregar sua conta, os catálogos e os vídeos.</p>
      <a href="/">Tentar novamente</a>
      <small>A MartinTech View mantém apenas os arquivos do aplicativo disponíveis offline.</small>
    </main>
  </body>
</html>
